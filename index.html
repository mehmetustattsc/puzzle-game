<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16191E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petek Ustası">
<meta name="description" content="Arılarla renkli petekleri topla, resmi tamamla. Hexagon colour puzzle game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2l8.7 5v10L12 22l-8.7-5V7z' fill='%23F2A93B'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Petek Ustası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one-screen game. Header (level+tier, shape progress, lives, honey) / canvas stage (board, hive, bee rows) / boost bar. Single dark hive look. */
:root{
  --bg:#16191E;
  --wax:#272C34;
  --wax-2:#39404A;
  --amber:#F2A93B;
  --amber-deep:#C9781A;
  --ink:#F2F4F7;
  --muted:#A7B0BC;
  --ok:#43A047;
  --warn:#FB8C00;
  --hot:#E53935;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 50% 0%,rgba(242,169,59,.12),transparent 60%);-webkit-tap-highlight-color:transparent;user-select:none}
.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;padding-block:6px}
.top{display:flex;align-items:center;gap:10px;padding-block:2px 6px}
.lvl{display:flex;flex-direction:column;line-height:1;gap:3px}
.lvl b{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--amber)}
.tier{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 6px;color:#fff;background:var(--ok);text-align:center}
.tier.t1{background:var(--warn)}.tier.t2{background:var(--hot)}
.pic{flex:1;min-width:0}
.pic span{font-family:var(--font-display);font-weight:600;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:7px;border-radius:8px;background:var(--wax-2);overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber-deep),var(--amber));transition:width .2s}
.pill{display:flex;align-items:center;gap:4px;background:var(--wax);border-radius:999px;padding:4px 9px 4px 6px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;line-height:1}
.pill svg{width:16px;height:16px;flex:none}
.pill small{font-size:10px;color:var(--muted);font-weight:700}
.lives{flex-direction:column;align-items:flex-start;gap:1px;padding:4px 9px}
.lives div{display:flex;align-items:center;gap:4px}
#stage{flex:1;min-height:0;position:relative}
#cv{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding-top:6px}
.tools button{font:800 11px/1.1 var(--font-body);color:var(--ink);background:var(--wax);border:1px solid var(--wax-2);border-radius:12px;padding:6px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tools button small{font-weight:700;font-size:10px;color:var(--amber);font-variant-numeric:tabular-nums}
.tools button svg{width:26px;height:22px;color:var(--muted)}
.tools button.on svg{color:#2A1608}
.tools button.on{background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#2A1608;border-color:transparent}
.tools button.on small{color:#4A2A0C}
.tools button.armed{outline:2px solid var(--amber);outline-offset:1px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.banner{position:absolute;left:0;right:0;bottom:6px;margin:0 auto;width:max-content;max-width:100%;display:flex;gap:10px;align-items:center;background:var(--wax);border:1px solid var(--amber);border-radius:999px;padding:6px 6px 6px 14px;font-weight:800;font-size:13px}
.banner button{font:800 12px var(--font-body);background:var(--wax-2);color:var(--ink);border:0;border-radius:999px;padding:6px 10px;cursor:pointer}
.toast{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;margin:0 auto;width:max-content;max-width:100%;background:var(--amber);color:#2A1608;font-weight:800;font-size:13px;border-radius:999px;padding:6px 14px;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(8,10,13,.74);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.card{background:var(--wax);border:1px solid var(--wax-2);border-radius:22px;padding:22px 20px;width:min(360px,100%);text-align:center;display:flex;flex-direction:column;gap:11px;max-height:92%;overflow:auto}
.card h2{font-family:var(--font-display);font-weight:800;font-size:27px;margin:0;color:var(--amber);text-wrap:balance;line-height:1.1}
.card p{margin:0;color:var(--muted);line-height:1.45}
.card .note{font-size:12px}
.card canvas{margin:0 auto;display:block;max-width:100%}
.card .rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;font-weight:700;font-variant-numeric:tabular-nums}
.card .rows b{color:var(--amber);text-align:right}
.card .btn{font:800 16px var(--font-body);border-radius:14px;padding:13px;border:0;cursor:pointer;background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#2A1608}
.card .btn.ghost{background:var(--wax-2);color:var(--ink)}
.card .btn:disabled{opacity:.45;cursor:default}
/* home screen */
.home{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:hidden;--tabh:calc(58px + env(safe-area-inset-bottom,0px))}
.pager{position:absolute;left:0;top:0;bottom:var(--tabh);width:300%;display:flex;transform:translateX(-33.3333%);transition:transform .32s cubic-bezier(.2,.8,.3,1);touch-action:pan-y;z-index:1}
.pager.drag{transition:none}
.page{width:33.3333%;height:100%;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px)}
.page-in{max-width:520px;margin:0 auto;padding-block:14px 20px;display:flex;flex-direction:column;gap:12px}
.page-in h2{font-family:var(--font-display);font-weight:800;font-size:30px;margin:0;color:var(--amber);line-height:1}
.page-in .lead{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;gap:6px;background:rgba(22,25,30,.92);border-top:1px solid var(--wax-2);z-index:3}
.tabbar button{position:relative;flex:1;max-width:150px;background:none;border:0;color:var(--muted);font:800 11px var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--amber);background:rgba(242,169,59,.1)}
.tabbar .badge{position:absolute;top:4px;right:calc(50% - 22px);width:18px;height:18px;border-radius:50%;background:#E53935;color:#fff;font:800 11px/18px var(--font-body);font-style:normal}
.alb{display:flex;align-items:center;gap:12px;background:rgba(39,44,52,.88);border:1px solid var(--wax-2);border-radius:16px;padding:10px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.alb canvas{width:64px;height:52px;flex:none;border-radius:8px;background:#1D2126}
.alb .ai{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.alb b{font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.1}
.alb .stars{color:#F2B544;letter-spacing:2px;font-size:15px}.alb .stars i{color:#4A525D;font-style:normal}
.alb small{font-size:11.5px;color:var(--muted);font-weight:700}
.alb .claim{flex:none;font:800 12px var(--font-body);border:0;border-radius:10px;padding:8px 10px;background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#2A1608;cursor:pointer;animation:breathe 1.4s ease-in-out infinite}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stk figure{margin:0;background:var(--bg);border:1px solid var(--wax-2);border-radius:12px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.stk canvas{max-width:100%}
.stk figcaption{font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1}
.stk .cnt{position:absolute;top:4px;right:4px;font:800 10px var(--font-body);background:var(--amber);color:#2A1608;border-radius:6px;padding:0 5px}
.pcard{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,#4A2F12,rgba(39,44,52,.9));border:1px solid var(--amber-deep);border-radius:18px;padding:12px}
.pcard .mascot{width:72px;height:72px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}
.pstats div{display:flex;flex-direction:column;align-items:center;background:rgba(22,25,30,.5);border-radius:10px;padding:6px 2px}
.pstats b{font-family:var(--font-display);font-size:22px;color:var(--amber);line-height:1}
.pstats span{font-size:10.5px;color:var(--muted);font-weight:700;text-align:center}
.tcard{background:rgba(39,44,52,.88);border:1px dashed var(--wax-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tcard b{font-family:var(--font-display);font-size:18px;font-weight:600}
.tcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.tcard .row{display:flex;gap:8px}.tcard .row button{flex:1;font:800 13px var(--font-body);border:0;border-radius:10px;padding:10px;background:var(--wax-2);color:var(--muted)}
.soonTag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--wax-2);color:var(--amber);border-radius:6px;padding:2px 7px}
.home-in{max-width:520px;margin:0 auto;height:100%;min-height:470px;display:flex;flex-direction:column;gap:10px;padding-block:10px 12px}
.home-stats{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.home-set{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:-10px}
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding-top:6px}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:.95;margin:0;color:var(--amber);letter-spacing:-.01em;text-shadow:0 3px 0 var(--amber-deep)}
.hero p{margin:0;color:var(--muted);font-weight:700}
.play{font:800 26px/1 var(--font-display);color:#2A1608;border:0;border-radius:20px;padding:16px 12px 13px;cursor:pointer;background:linear-gradient(180deg,#FFC65C,var(--amber-deep));box-shadow:0 6px 0 #8A4F0E;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .1s}
.play small{font:800 13px var(--font-body);color:#4A2A0C}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #8A4F0E}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{position:relative;background:rgba(39,44,52,.82);backdrop-filter:blur(3px);border:1px solid var(--wax-2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0;text-align:left}
.hc-ico{width:42px;height:42px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.hc-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.hcard .badge{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#E53935;color:#fff;font:800 13px/22px var(--font-body);text-align:center;font-style:normal;animation:breathe 1.4s ease-in-out infinite}
.hcard.ready{border-color:var(--amber);box-shadow:0 0 0 2px rgba(242,169,59,.3)}
.home-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.home-bg svg{width:100%;height:100%;display:block}
.home-in{position:relative;z-index:1}
.lobby{flex:1;min-height:0;display:grid;grid-template-columns:78px 1fr 78px;gap:6px;align-items:center}
.side{display:flex;flex-direction:column;gap:10px;align-items:center}
.tileb{position:relative;width:78px;background:rgba(39,44,52,.85);border:1px solid var(--wax-2);border-radius:18px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tileb .hc-ico{width:40px;height:40px}
.tileb b{font:800 10.5px/1.15 var(--font-body);text-align:center;text-wrap:balance}
.tileb small{font:800 10px/1.1 var(--font-body);color:var(--amber);text-align:center;min-height:11px}
.tileb.soon{cursor:default;opacity:.75;border-style:dashed}
.tileb.offer{border-color:var(--amber-deep);background:linear-gradient(160deg,#4A2F12,rgba(39,44,52,.9))}
.tileb.ready{border-color:var(--amber);box-shadow:0 0 0 2px rgba(242,169,59,.35),0 4px 0 rgba(0,0,0,.25)}
.tileb:active{transform:scale(.94)}
.tileb .badge{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#E53935;color:#fff;font:800 13px/22px var(--font-body);text-align:center;font-style:normal;animation:breathe 1.4s ease-in-out infinite}
.lobby .hero{min-width:0}
.lobby .hero h1{font-size:clamp(20px,calc((100vw - 190px)/8.2),46px);max-width:100%}
.lobby .hero p{font-size:12.5px;max-width:22ch}
.lobby .mascot.big{width:min(150px,22vh);height:min(150px,22vh)}
.play{align-self:center;width:min(100%,340px);font-size:28px;padding:15px 12px 12px}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{background:var(--bg);border:1px solid var(--wax-2);border-radius:12px;padding:7px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.15;text-align:center;min-width:0}
.day b{font-size:11px;color:var(--ink);font-weight:800}
.day .ic{display:flex;gap:1px;justify-content:center;flex-wrap:wrap}
.day.done{opacity:.45}.day.done b::after{content:" ✓"}
.day.today{border-color:var(--amber);background:#3A2814;box-shadow:0 0 0 2px rgba(242,169,59,.35)}
.day.big{grid-column:span 2;background:linear-gradient(160deg,#4A2F12,var(--bg))}
.day.big.today{background:linear-gradient(160deg,#6A4316,#3A2814)}
.hcard b{font-family:var(--font-display);font-size:17px;font-weight:600}
.hcard span{font-size:12px;color:var(--muted);line-height:1.35}
.hcard.soon{border-style:dashed;background:transparent}
.hcard.wide{grid-column:1/-1}
.homebtn{background:var(--wax);border:0;border-radius:12px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.homebtn svg{width:20px;height:20px}
/* mascot */
.mwrap{position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.mascot{width:128px;height:128px;overflow:visible}
.mascot.big{width:170px;height:170px}
.bubble{position:relative;max-width:min(260px,90%);text-align:center;background:var(--ink);color:#2A1608;font:800 17px/1.15 var(--font-display);padding:7px 14px 5px;border-radius:14px;transform-origin:50% 100%;animation:pop .35s cubic-bezier(.3,1.6,.6,1) both;text-wrap:balance}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.m-happy{animation:hop .5s ease-in-out infinite alternate}
.m-sad{animation:slump 2.6s ease-in-out infinite;transform-origin:50% 100%}
.m-idle{animation:bob 2.8s ease-in-out infinite}
.mascot .wing{transform-box:fill-box;transform-origin:50% 100%;animation:flap .14s ease-in-out infinite alternate}
.m-sad .wing{animation:none}
@keyframes hop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-12px) rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes slump{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(2px)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.pill.tap{cursor:pointer;border:0;color:var(--ink);font:inherit;font-weight:800}
.pill.tap.off{opacity:.45;text-decoration:line-through}
.hcard.link{cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.hcard.offer{background:linear-gradient(160deg,#4A2F12,var(--wax));border-color:var(--amber-deep)}
.near{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink)}
.meter{height:10px;border-radius:10px;background:var(--wax-2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber-deep),var(--amber))}
.shop{display:flex;flex-direction:column;gap:8px;text-align:left}
.pack{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--wax-2);border-radius:14px;padding:10px 10px 10px 12px}
.pack.best{border-color:var(--amber)}
.pack .jar{width:34px;height:34px;flex:none}
.pack div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pack b{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.1}
.pack span{font-size:12px;color:var(--muted)}
.pack .tag{align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:#2A1608;border-radius:6px;padding:1px 6px;margin-bottom:2px}
.pack button{font:800 14px var(--font-body);border:0;border-radius:10px;padding:9px 10px;min-width:74px;cursor:pointer;background:linear-gradient(180deg,var(--amber),var(--amber-deep));color:#2A1608;font-variant-numeric:tabular-nums}
.pack button:disabled{opacity:.45;cursor:default}
.loading{display:flex;flex-direction:column;align-items:center;gap:8px}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
.tools button,.card .btn,.pill.tap,.hcard.link,.homebtn,.pack button,.banner button{transition:transform .08s ease,filter .08s ease}
.tools button:active,.card .btn:active,.pill.tap:active,.hcard.link:active,.homebtn:active,.pack button:active,.banner button:active{transform:scale(.94);filter:brightness(1.1)}
.modal:not([hidden]){animation:fade .18s ease both}.modal:not([hidden]) .card{animation:cardIn .32s cubic-bezier(.2,1.4,.5,1) both}
.toast.show{animation:toastIn .3s cubic-bezier(.2,1.5,.5,1) both}
.play{animation:breathe 2.6s ease-in-out infinite}
.prog i{background-size:200% 100%;background-image:linear-gradient(90deg,var(--amber-deep),var(--amber),#FFD98A,var(--amber),var(--amber-deep));animation:shine 2.4s linear infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{transform:translateY(18px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{transform:translateY(-10px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes shine{from{background-position:200% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.prog i,.toast{transition:none}.m-happy,.m-sad,.m-idle,.mascot .wing,.bubble,.dots i,.play,.prog i,.modal,.card,.toast.show{animation:none!important}}

.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.pinfo>b{font-family:var(--font-display);font-size:20px;color:var(--ink)}

.tstat{display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(22,25,30,.55);border-radius:10px;padding:5px 2px}

.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:rgba(22,25,30,.5);border-radius:12px;padding:8px 3px}
.badge svg{width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}.badge b{font-size:10.5px;line-height:1.1;color:var(--ink)}.badge small{font-size:9px;line-height:1.15;color:var(--muted)}
.badge.off svg{filter:grayscale(1) brightness(.55)}.badge.off b{color:var(--muted)}
.podium{width:100%;max-width:240px;height:auto;align-self:center}
.lbrows{display:flex;flex-direction:column;gap:5px}

.page-in h2{color:#E08A12;text-shadow:0 2px 0 rgba(255,255,255,.7)}.page-in>.lead,.page-in>.note{color:#2E3A46!important;font-weight:600}
.hero h1{text-shadow:0 3px 0 var(--amber-deep),0 0 14px rgba(255,255,255,.85)}.hero p{color:#2E3A46}

/* ---- celebration effects (fx layer above everything, never catches taps) ---- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx-rays{position:absolute;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,226,130,.75) 0 9deg,rgba(255,226,130,0) 9deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);
  animation:fxSpin 7s linear infinite,fxRaysIn .45s cubic-bezier(.2,1.4,.4,1) both}
.fx-rays.out{animation:fxSpin 7s linear infinite,fxFadeOut .5s ease-in forwards}
.fx-spark{position:absolute;width:var(--s,10px);height:var(--s,10px);margin:calc(var(--s,10px)/-2) 0 0 calc(var(--s,10px)/-2);
  background:var(--c,#FFE066);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:fxSpark var(--d,.9s) cubic-bezier(.1,.7,.3,1) forwards}
.fx-coin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;will-change:transform,opacity;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.fx-banner{position:absolute;left:50%;top:34%;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-50%);
  animation:fxBanner 1.9s cubic-bezier(.2,.9,.3,1) forwards}
.fx-banner b{font:800 clamp(34px,10vw,52px)/1 var(--font-display);color:#fff;text-shadow:0 3px 0 #C9781A,0 0 18px rgba(0,0,0,.45);white-space:nowrap}
.fx-banner span{font:800 16px var(--font-body);color:#fff;background:rgba(22,25,30,.75);padding:3px 12px;border-radius:999px}
.fx-stamp{margin-top:6px;font:800 22px/1 var(--font-display);letter-spacing:.06em;color:#fff;padding:6px 16px 4px;border:3px solid #fff;border-radius:10px;
  background:var(--sc,#E53935);transform:rotate(-8deg);box-shadow:0 4px 0 rgba(0,0,0,.3);animation:fxStamp .5s .35s cubic-bezier(.3,1.6,.5,1) both}
.fx-gift{position:absolute;left:50%;top:44%;width:150px;height:150px;margin:-75px 0 0 -75px}
.fx-gift svg{width:100%;height:100%;overflow:visible}
.fx-gift .box{animation:fxShake .6s ease-in-out 2;transform-origin:75px 140px;transform-box:view-box}
.fx-gift .lid{animation:fxLid .55s 1.2s cubic-bezier(.3,1.4,.5,1) forwards;transform-origin:75px 60px;transform-box:view-box}
.fx-gift.out{animation:fxFadeOut .45s ease-in forwards}
.fx-prize{position:absolute;display:flex;align-items:center;justify-content:center;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.3);animation:fxPrize 1.3s cubic-bezier(.2,1.2,.4,1) forwards}
.fx-prize svg{width:30px;height:30px}
.fx-bigstar{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;animation:fxBigStar 1.4s cubic-bezier(.2,1.3,.4,1) forwards}
.raysWrap{position:relative}.raysWrap .rays{position:absolute;left:50%;top:58%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,226,130,.32) 0 9deg,rgba(255,226,130,0) 9deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 66%);mask:radial-gradient(circle,#000 20%,transparent 66%);animation:fxSpin 9s linear infinite}
.raysWrap .mwrap{position:relative;z-index:1}
.pulse{animation:fxPulse .35s ease-out}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxRaysIn{from{transform:scale(.2);opacity:0}}
@keyframes fxFadeOut{to{opacity:0}}
@keyframes fxSpark{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(160deg);opacity:0}}
@keyframes fxBanner{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}14%{transform:translate(-50%,-50%) scale(1.08);opacity:1}24%{transform:translate(-50%,-50%) scale(1)}78%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-80%) scale(.92);opacity:0}}
@keyframes fxStamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@keyframes fxShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes fxLid{to{transform:translate(18px,-70px) rotate(28deg);opacity:0}}
@keyframes fxPrize{0%{transform:translate(0,30px) scale(.2);opacity:0}40%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:1}}
@keyframes fxBigStar{0%{transform:scale(.1) rotate(-60deg);opacity:0}45%{transform:scale(1.15) rotate(8deg);opacity:1}70%{transform:scale(1) rotate(0)}100%{transform:scale(1.05);opacity:0}}
@keyframes fxPulse{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.fx-rays,.raysWrap .rays{animation:none}.fx-spark,.fx-coin{display:none}}
.adov{position:fixed;inset:0;z-index:80;background:rgba(8,10,13,.9);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}

<script>
/* ================= palette & helpers ================= */
const COL={R:'#E53935',O:'#FB8C00',Y:'#FDD835',G:'#43A047',B:'#1E88E5',P:'#8E24AA',K:'#F06292',N:'#7B5136',W:'#F5F5F5',D:'#1E1E1E',C:'#26C6DA',
  M:'#A0182E',L:'#A5D63A',A:'#8FD3FF',V:'#B79CE6',T:'#00897B',
  E:'#F8BBD9',H:'#8EE3C3',I:'#FFCC99',J:'#FFF3A3',Q:'#757F8A',U:'#D7B98E'};
/* look-alike shades used to make later levels trickier: red/bordo, green/lime, blue/light blue, purple/lavender, cyan/teal */
const SHADE={R:'M',G:'L',B:'A',P:'V',C:'T',K:'E',O:'I',Y:'J',N:'U'};
/* noise partners: similar tones sprinkled into big areas on harder levels, so a colour that looks open may only have a few cells on the edge */
const NOISE={K:['E','V'],E:['K','W'],G:['L','H'],L:['G','Y'],H:['C','L'],C:['H','A','T'],T:['C','G'],B:['A','P'],A:['B','C','W'],P:['V','B'],V:['P','E'],R:['M','O'],M:['R','P'],O:['I','Y'],I:['O','E'],Y:['J','L'],J:['Y','W'],N:['U','M'],U:['N','I'],W:['J','A','E'],D:['Q','P'],Q:['D','W']};
const S3=Math.sqrt(3),MAX_SLOTS=7,MAX_LIVES=5,LIFE_MS=20*60*1000,SAVE_KEY='petek-ustasi-v2';
const TIERS=['Normal','Zor','Çok zor'],TIER_REWARD=[20,50,120],STREAK_STEP=10,DAILY_HONEY=50,START_HONEY=500;
const COST={slot:300,clear:800,pick:500,shuffle:400,lives:600};
const FREE_2X_PER_LEVEL=0,NEW_PLAYER_2X=5*60,DAILY_2X=120; // no free minute per level: 2x comes from the welcome gift, rewards or the shop
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const ch=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return `rgb(${ch(n>>16)},${ch(n>>8&255)},${ch(n&255)})`}
function isLight(hex){const n=parseInt(hex.slice(1),16);return(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255>0.6}
function hash(i,j,s){const v=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return v-Math.floor(v)}
function vnoise(x,y,s){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(i,j,s),b=hash(i+1,j,s),c=hash(i,j+1,s),d=hash(i+1,j+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y,s)=>0.65*vnoise(x,y,s)+0.35*vnoise(x*2.1,y*2.1,s+9);

/* ================= shape designs =================
   Coordinates: y in [-1,1] (down is +), x in about [-1.25,1.25]. Return a colour key or null. */
function tpl(rows){const th=rows.length,tw=Math.max(...rows.map(s=>s.length)),s=Math.min(2.45/tw,1.98/th);
  return(x,y)=>{const u=Math.floor(x/s+tw/2),v=Math.floor(y/s+th/2);if(v<0||v>=th||u<0||u>=tw)return null;const ch=rows[v][u];return COL[ch]?ch:null}}
function petal(x,y,bx,by,ang,len,wid){const ca=Math.cos(ang),sa=Math.sin(ang),dx=x-bx,dy=y-by,u=dx*ca+dy*sa,v=-dx*sa+dy*ca;return u>0&&u<len&&Math.abs(v)<wid*Math.sin(Math.PI*u/len)}
const shade2=k=>k;
const E=(x,y,cx,cy,rx,ry)=>((x-cx)/rx)**2+((y-cy)/ry)**2<=1;
function inPoly(x,y,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
const DESIGNS={
  'Kalp':(x,y)=>{const X=x*1.05,Y=-y*1.1+0.2;if(Math.pow(X*X+Y*Y-1,3)-X*X*Y*Y*Y>0)return null;if(Math.hypot(x+0.42,y+0.28)<0.2)return'K';return'R'},
  'Hedef':(x,y,P)=>{const d=Math.hypot(x,y);if(d>0.98)return null;const k=P.pal.length;return P.pal[Math.min(k-1,Math.floor(d/0.98*k))]},
  'Futbol topu':(x,y)=>{const d=Math.hypot(x,y);if(d>0.97)return null;if(d>0.88)return'D';if(d<0.27)return'D';for(let k=0;k<5;k++){const a=(-90+72*k)*Math.PI/180;if(Math.hypot(x-0.68*Math.cos(a),y-0.68*Math.sin(a))<0.2)return'D'}return'W'},
  'Dünya':(x,y,P)=>{const d=Math.hypot(x,y);if(d>0.98)return null;if(Math.abs(y)>0.8)return'W';const n=fbm(x*1.9+5,y*1.9+3,P.seed);if(n>0.63)return'N';if(n>0.5)return'G';if(P.rich&&n>0.45)return'C';return'B'},
  'Çiçek':(x,y,P)=>{const d=Math.hypot(x,y),t=Math.atan2(y,x);if(d<0.3)return'Y';if(d<0.38)return'N';if(d<0.5+0.47*Math.abs(Math.cos(2.5*t)))return P.pal[0];return null},
  'Gün batımı':(x,y)=>{if(Math.abs(x)>1.15||Math.abs(y)>0.98)return null;const h=0.28;if(y<h){if(Math.hypot(x,y-0.22)<0.48)return'Y';return y<-0.5?'P':y<-0.12?'K':'O'}if(Math.abs(x)<0.45*(1-(y-h)/0.8)&&Math.floor((y-h)*9)%2===0)return'O';return'B'},
  'Gökkuşağı':(x,y,P)=>{const d=Math.hypot(x,y-0.45);if(Math.hypot(Math.abs(x)-0.8,y-0.55)<0.32)return'W';if(y>0.45||d<0.42||d>1.32)return null;const k=P.bands;return['R','O','Y','G','B','P'][Math.min(k-1,Math.floor((1.32-d)/0.9*k))]},
  'Karpuz':(x,y,P)=>{const d=Math.hypot(x,y+0.45);if(y<-0.45||d>1.38)return null;if(d>1.2)return'G';if(d>1.08)return'W';if(d<0.95&&hash(Math.round(x*6),Math.round(y*6),P.seed)>0.85)return'D';return'R'},
  'Yıldız':(x,y)=>{const d=Math.hypot(x,y),seg=2*Math.PI/5,th=Math.atan2(y,x)+Math.PI/2,t=Math.abs(((th%seg+seg)%seg)-seg/2)/(seg/2),rr=(0.44+0.56*t)*0.98;if(d>rr)return null;return d>rr-0.2?'O':'Y'},
  'Gezegen':(x,y)=>{const d=Math.hypot(x,y),planet=d<0.62,e=Math.hypot(x/1.22,y/0.34),ring=e>0.8&&e<1;if(ring&&!(planet&&y<0))return'Y';if(planet)return Math.floor((y+0.62)*5)%2?'O':'N';return null},
  'Mozaik':(x,y,P)=>{if(Math.hypot(x,y)>0.98)return null;let b=0,bd=9;P.pts.forEach((p,i)=>{const dd=Math.hypot(x-p[0],y-p[1]);if(dd<bd){bd=dd;b=i}});return P.pal[b%P.pal.length]},
  'Papatya':(x,y,P)=>{const d=Math.hypot(x,y),t=Math.atan2(y,x);if(d<0.27)return'Y';if(d<0.32)return'O';const c=Math.abs(Math.cos(P.petals*t/2));return d<0.97*(0.42+0.58*Math.pow(c,0.7))?P.fpal[0]==='Y'?'W':(P.daisy||'W'):null},
  'Ayçiçeği':(x,y,P)=>{const d=Math.hypot(x,y),t=Math.atan2(y,x);if(d<0.4)return Math.floor(d*16+t*1.6+20)%2?'N':'D';if(d<0.46)return'O';const c=Math.abs(Math.cos(P.petals2*t/2));return d<0.98*(0.55+0.45*Math.pow(c,0.45))?'Y':null},
  'Lale':(x,y,P)=>{if(petal(x,y,-0.38,0.75,-2.2,0.6,0.16)||petal(x,y,0.38,0.75,-0.94,0.6,0.16))return'G';if(Math.abs(x)<0.06&&y>0&&y<0.98)return'G';
    if(y>-0.4&&y<0.12&&Math.abs(x)<0.52*Math.sqrt(Math.max(0,1-Math.pow((y+0.4)/0.52,2))))return P.fpal[0];
    for(const [xi,k] of [[-0.3,P.fpal[0]],[0.3,P.fpal[0]],[0,P.fpal[1]]])if(y>=-0.95&&y<=-0.4&&Math.abs(x-xi)<0.22*(y+0.95)/0.55)return k;return null},
  'Gül':(x,y,P)=>{const d=Math.hypot(x,y),t=Math.atan2(y,x);if(d<0.8)return Math.floor(d*7-t/Math.PI+10)%2?P.rose[0]:P.rose[1];if(petal(x,y,-0.4,0.55,2.6,0.75,0.22)||petal(x,y,0.4,0.55,0.55,0.75,0.22))return'G';return null},
  'Lotus':(x,y,P)=>{const bx=0,by=0.42;if(Math.hypot(x,by-y)<0.17&&y<by)return'Y';
    for(const a of[-125,-90,-55])if(petal(x,y,bx,by,a*Math.PI/180,1.1,0.27))return'W';
    for(const a of[-170,-145,-35,-10])if(petal(x,y,bx,by,a*Math.PI/180,0.95,0.25))return P.fpal[0];
    if(y>0.42&&Math.abs(x)<1.2&&y<0.98)return Math.hypot((Math.abs(x)-0.82)/1.6,y-0.72)<0.16?'G':'B';return null},
  'Kır çiçekleri':(x,y,P)=>{if(Math.abs(x)>1.2||Math.abs(y)>0.98)return null;
    for(const f of P.flowers){const d=Math.hypot(x-f.x,y-f.y);if(d<f.r*0.38)return'Y';if(d<f.r*(0.55+0.45*Math.abs(Math.cos(2.5*Math.atan2(y-f.y,x-f.x)))))return f.k}
    for(const f of P.flowers)if(Math.abs(x-f.x)<0.045&&y>f.y)return'G';return y>0.4?'G':'C'},
  'Buket':(x,y,P)=>{const fl=[[-0.52,-0.4,P.fpal[0]],[0.52,-0.4,P.fpal[1]],[0,-0.62,P.fpal[2]]];
    for(const[fx,fy,k]of fl){const d=Math.hypot(x-fx,y-fy);if(d<0.13)return'Y';if(d<0.38*(0.65+0.35*Math.abs(Math.cos(3*Math.atan2(y-fy,x-fx)))))return k}
    if(y>0.25&&y<0.98&&Math.abs(x)<0.62*(1-(y-0.25)/0.95))return y<0.4?'O':'N';
    for(const[fx,fy]of fl){const t=(y-fy)/(0.3-fy);if(t>0&&t<1&&Math.abs(x-fx*(1-t))<0.05)return'G'}return null},
  'Kalemler':(x,y,P)=>{if(y>0.82)return Math.abs(x)<1.2?'N':null;const n=P.pens.length,w=2.3/n;
    for(let i=0;i<n;i++){const xi=-1.15+w*(i+0.5),hw=w*0.4,top=-0.3+P.pens[i].h;if(Math.abs(x-xi)>hw)continue;
      if(y>=top&&y<=0.82)return Math.abs(x-xi)<hw*0.3&&y>top+0.08?shade2(P.pens[i].k):P.pens[i].k;
      const tipTop=top-0.5;if(y>=tipTop&&y<top&&Math.abs(x-xi)<hw*(y-tipTop)/0.5)return y<tipTop+0.18?'D':'W'}return null},
  /* ---- new designs ---- */
  'Balonlar':(x,y,P)=>{const bs=[[-0.62,-0.38,P.c[0]],[0.04,-0.55,P.c[1]],[0.64,-0.32,P.c[2]]];
    for(const[bx,by,k]of bs){if(E(x,y,bx-0.11,by-0.16,0.08,0.11))return'W';if(E(x,y,bx,by,0.37,0.45))return k;if(inPoly(x,y,[[bx-0.08,by+0.5],[bx+0.08,by+0.5],[bx,by+0.42]]))return k}
    for(const[bx,by]of bs){const t=(y-(by+0.5))/(0.98-(by+0.5));if(t>0&&t<1){const xi=bx*(1-t)+0.06*Math.sin(t*9);if(Math.abs(x-xi)<0.045)return'D'}}return null},
  'Dondurma':(x,y,P)=>{if(inPoly(x,y,[[-0.44,0.06],[0.44,0.06],[0,0.98]]))return((Math.floor((x+y)*6.5)&1)^(Math.floor((y-x)*6.5)&1))?'O':'N';
    if(E(x,y,0.06,-0.98,0.12,0.12))return'R';
    const top=E(x,y,0,-0.66,0.32,0.27),low=E(x,y,0,-0.22,0.5,0.34)||E(x,y,0,0.02,0.52,0.14);
    if(top||low){if(hash(Math.floor(x*9),Math.floor(y*9),P.seed)>0.9)return P.c[3];return top?P.c[1]:P.c[0]}return null},
  'Kek':(x,y,P)=>{if(E(x,y,0,-0.88,0.13,0.12))return'R';
    if(y>0.12&&y<0.95){const hw=0.58-0.16*(y-0.12)/0.83;if(Math.abs(x)<hw)return Math.floor((x/hw+1)*4)&1?P.c[0]:'W'}
    if(E(x,y,0,-0.05,0.68,0.24)||E(x,y,0,-0.38,0.5,0.22)||E(x,y,0,-0.64,0.3,0.16)){if(hash(Math.floor(x*10),Math.floor(y*10),P.seed)>0.88)return P.c[3];return P.c[1]}return null},
  'Şemsiye':(x,y,P)=>{const cy=0.05;if(Math.hypot(x,y-cy)<1.02&&y<=cy-0.11*Math.abs(Math.sin((x+1.02)*Math.PI*2.45))){const a=Math.atan2(y-cy,x)+Math.PI;return Math.floor(a/(Math.PI/6))&1?P.c[0]:P.c[1]}
    if(E(x,y,0,-1.0,0.06,0.07))return'D';if(Math.abs(x)<0.05&&y>cy&&y<0.82)return'D';const d=Math.hypot(x+0.14,y-0.82);if(y>0.82&&d<0.19&&d>0.09)return'D';return null},
  'Roket':(x,y,P)=>{if(inPoly(x,y,[[-0.3,0.25],[-0.6,0.72],[-0.24,0.58]])||inPoly(x,y,[[0.3,0.25],[0.6,0.72],[0.24,0.58]]))return P.c[0];
    if(E(x,y,0,-0.05,0.31,0.74)){const d=Math.hypot(x,y+0.18);if(d<0.13)return'B';if(d<0.19)return'D';return y<-0.48?P.c[0]:'W'}
    if(inPoly(x,y,[[-0.2,0.66],[0.2,0.66],[0,1.02]]))return y<0.82?'Y':'O';
    for(const s of P.stars)if(Math.abs(x-s[0])+Math.abs(y-s[1])<0.08)return'Y';return null},
  'Yelkenli':(x,y,P)=>{if(y>0.48)return Math.floor((y+0.06*Math.sin(x*6+P.seed))*10)&1?'B':'C';
    if(inPoly(x,y,[[-0.78,0.24],[0.78,0.24],[0.52,0.5],[-0.52,0.5]]))return'N';
    if(Math.abs(x+0.02)<0.045&&y>-0.88&&y<0.24)return'D';
    if(inPoly(x,y,[[0.06,-0.82],[0.06,0.16],[0.62,0.16]]))return'W';
    if(inPoly(x,y,[[-0.08,-0.66],[-0.08,0.16],[-0.58,0.16]]))return P.c[0];
    if(inPoly(x,y,[[0,-0.98],[0,-0.82],[0.22,-0.9]]))return'R';
    if(E(x,y,-0.86,-0.7,0.2,0.2))return'Y';return null},
  'Deniz feneri':(x,y,P)=>{if(y>0.74)return Math.floor((y+0.05*Math.sin(x*7))*12)&1?'B':'C';if(E(x,y,0,0.76,0.55,0.16))return'N';
    if(y>-0.34&&y<0.72){const hw=0.16+0.12*(y+0.34)/1.06;if(Math.abs(x)<hw)return Math.floor((y+0.34)*4.5)&1?'W':'R'}
    if(Math.abs(x)<0.26&&y>-0.42&&y<=-0.34)return'D';if(Math.abs(x)<0.13&&y>-0.62&&y<=-0.42)return'Y';
    if(inPoly(x,y,[[-0.19,-0.62],[0.19,-0.62],[0,-0.84]]))return'R';
    if(inPoly(x,y,[[0.13,-0.56],[1.3,-0.92],[1.3,-0.22]])||inPoly(x,y,[[-0.13,-0.56],[-1.3,-0.92],[-1.3,-0.22]]))return'Y';return null},
  'Dağlar':(x,y,P)=>{if(y>0.6)return Math.floor((y+0.04*Math.sin(x*5))*14)&1?'G':'L';
    const ms=[[-0.55,-0.42,0.78,P.c[0]],[0.4,-0.68,0.85,P.c[1]],[1.05,-0.2,0.6,P.c[0]]];let hit=null;
    for(const[px,py,hw,k]of ms){if(y>=py&&Math.abs(x-px)<=hw*(y-py)/(0.6-py)){hit=y<py+0.24-0.06*Math.sin(x*14)?'W':k}}
    if(hit)return hit;if(E(x,y,-0.15,-0.72,0.17,0.17))return'Y';return null},
  'Kaktüs':(x,y,P)=>{if(y>0.46&&y<0.97){const hw=0.4-0.1*(y-0.46)/0.51;if(Math.abs(x)<hw)return y<0.58?'N':P.c[0]}
    if(E(x,y,0,-0.64,0.12,0.09))return'K';
    const g=(Math.abs(x)<0.22&&y>-0.52&&y<0.46)||E(x,y,0,-0.52,0.22,0.12)||(x>-0.56&&x<-0.2&&y>-0.04&&y<0.11)||(x>-0.56&&x<-0.4&&y>-0.44&&y<0.1)||E(x,y,-0.48,-0.44,0.08,0.06)||(x>0.2&&x<0.56&&y>0.08&&y<0.22)||(x>0.42&&x<0.56&&y>-0.3&&y<0.22)||E(x,y,0.49,-0.3,0.07,0.06);
    if(g)return hash(Math.floor(x*11),Math.floor(y*11),P.seed)>0.86?'L':'G';return null},
  'Kelebek':(x,y,P)=>{if(E(x,y,0,0.02,0.08,0.58))return'D';const ax=Math.abs(x);
    if(E(ax,y,0.5,-0.3,0.44,0.4)){if(E(ax,y,0.56,-0.34,0.14,0.14))return P.c[2];if(!E(ax,y,0.5,-0.3,0.36,0.32))return'D';return P.c[0]}
    if(E(ax,y,0.38,0.4,0.32,0.32)){if(E(ax,y,0.42,0.44,0.09,0.09))return'W';return P.c[1]}
    if(Math.abs(ax-0.1-(-y-0.55)*0.5)<0.035&&y<-0.55&&y>-0.95)return'D';return null},
  'Uğur böceği':(x,y,P)=>{if(E(x,y,0,-0.64,0.32,0.24)){if(E(Math.abs(x),y,0.13,-0.7,0.07,0.07))return'W';return'D'}
    if(E(x,y,0,0.14,0.72,0.74)){if(Math.abs(x)<0.04&&y>-0.45)return'D';for(const[sx,sy]of[[0.3,-0.12],[0.44,0.3],[0.18,0.58],[0.15,0.14]])if(E(Math.abs(x),y,sx,sy,0.13,0.13))return'D';return'R'}
    for(const ly of[-0.05,0.25,0.55])if(Math.abs(y-ly-(Math.abs(x)-0.7)*0.4)<0.04&&Math.abs(x)>0.7&&Math.abs(x)<1.0)return'D';return null},

 tutCoreT:'Merkez tuzağı',tutCore:['Resmin tam ortasında farklı renkte bir hücre var.','Onun arısı dıştaki bir arıya bağlı. Ortası açılana kadar ikisi de yuva tutar.','Bu bağlı çifti göndermeden önce ortaya giden yolu aç.'],
 tutKeyT:'Anahtar ve kilit',tutKey:['Kilitli sıradaki arılar gönderilemez.','Tahtada bir anahtar var. Anahtarlı hücre kenara ulaşınca kilit açılır.','Önce anahtara giden yolu temizle.'],
 tutShadeT:'Benzer renkler',tutShade:['Bazı renkler birbirine çok benzer: kırmızı ve bordo gibi.','Bunlar farklı renkler ve farklı arılar ister.','Kartlara ve tahtaya dikkatli bak.'],
 tutHardT:'Zor bölüm',tutHard:['Zor bölümlerde 5 yerine 4 yuva var.','Her hamle önemli. Sırayı planlayarak oyna.','Ödül de daha büyük: 50 bal.'],

 tutGateT:'Kepenkli kapı',tutGate:['Tahtanın bir bölümü kepenkle kapalı. Arılar oradan geçemez, altındaki petekler toplanamaz.','Kepenkteki sayı kadar petek toplandığında kapı açılır. Sayının yanında bir renk varsa yalnızca o renkteki petekler sayılır.'],
 tutTubeT:'Sürpriz tüp',tutTube:['Bazı yuva yollarının sonunda bir tüp var. Üstünde kaç sürü olduğu yazar ama renkleri gizlidir.','Tüp öne gelince sürüler birer birer çıkar, rengi de o zaman görünür. Biraz şans, biraz plan!'],gateOpen:'Kapı açıldı!',tubePick:'Tüpteki sürüler seçilemez',
 tutBoxT:'Renk kutusu',tutBox:['Kutunun rengindeki bir petek nerede toplanırsa toplansın, kutu sıradaki rengi tam o boşluğa geri fırlatır: arı alır, kutu geri koyar.','Kutunun rengi tahtada kalmazsa, kutu kalan bütün renkleri bir anda en son toplanan yerlere fırlatır.','Kutunun üstünde kalan renk sayısı ve şu anki rengi yazar. Köşedeki küçük altıgen sıradaki rengi gösterir.','Kutu boşalınca açılır ve yol serbest kalır.'],

 tutBasicsT:'How to play',tutBasics:['Tap one of the rows below: that colour’s bee swarm moves into a slot.','The bees fly around the board and collect hexagons of their colour from the outside in.','If the slots fill up and no bee can work, the level is over. Pick a row whose colour shows on the edge.'],
 tutHiddenT:'Sealed cells',tutHidden:['In some levels part of the honeycomb is sealed with wax. You can’t see the colour underneath.','When a cell next to a seal is collected, the seal opens and the colour shows.','Seals usually sit where two colours meet. Keep that in mind before sending your bees.'],
 tutLinksT:'Linked bees',tutLinks:['Cards joined by a chain move together.','All of them must be at the front. They can be linked side by side, one behind the other or diagonally.','Linked bees keep their slots until everyone in the group has finished.'],
 tutCoreT:'Centre trap',tutCore:['There is one cell of a different colour right in the middle of the picture.','Its bee is linked to an outer bee. Both hold a slot until the middle is open.','Clear a way to the middle before sending this pair.'],
 tutKeyT:'Key and lock',tutKey:['Bees in a locked row can’t be sent.','There is a key on the board. When the key cell reaches the edge, the lock opens.','Clear the way to the key first.'],
 tutShadeT:'Look-alike colours',tutShade:['Some colours look very similar, like red and dark red.','They are different colours and need different bees.','Look closely at the cards and the board.'],
 tutHardT:'Hard level',tutHard:['Hard levels have 4 slots instead of 5.','Every move counts. Plan your order.','The reward is bigger too: 50 honey.'],
 tutVhardT:'Very hard level',tutVhard:['The toughest levels: 4 slots and a tight layout.','Use a boost if you need one: +1 slot, clear colour, pick bee.','Reward: 120 honey.'],
 tutGateT:'Shutter gate',tutGate:['Part of the board is behind a shutter. Bees can’t pass through it and the hexagons under it can’t be collected.','The shutter opens once you collect as many hexagons as it shows. If a colour is shown next to the number, only hexagons of that colour count.'],
 tutTubeT:'Mystery tube',tutTube:['Some rows end in a tube. It shows how many swarms are inside, but not their colours.','When the tube reaches the front, the swarms come out one by one and only then show their colour. A bit of luck, a bit of planning!'],gateOpen:'Gate open!',tubePick:'Swarms in the tube can’t be picked',
 tutBoxT:'Colour box',tutBox:['Whenever a hexagon of the box’s colour is collected, the box throws its next colour right back into that spot: the bee takes one, the box puts one back.','If the box’s colour runs out on the board, the box throws all its remaining colours at once onto the most recently collected spots.','The box shows how many colours are left and its current colour. The small hexagon in the corner shows the next colour.','When the box is empty it opens and the way is free.'],

 tutBasicsT:'So wird gespielt',tutBasics:['Tippe auf eine der Reihen unten: Der Bienenschwarm dieser Farbe zieht in einen Platz.','Die Bienen fliegen um das Feld und sammeln Waben ihrer Farbe von außen nach innen.','Wenn alle Plätze voll sind und keine Biene arbeiten kann, ist das Level vorbei. Wähle eine Reihe, deren Farbe am Rand liegt.'],
 tutHiddenT:'Versiegelte Waben',tutHidden:['In manchen Levels ist ein Teil der Waben mit Wachs versiegelt. Die Farbe darunter ist nicht zu sehen.','Wird ein Feld neben dem Siegel gesammelt, öffnet sich das Siegel und die Farbe erscheint.','Siegel liegen meist dort, wo zwei Farben aufeinandertreffen. Denk daran, bevor du deine Bienen schickst.'],
 tutLinksT:'Verbundene Bienen',tutLinks:['Mit einer Kette verbundene Karten bewegen sich zusammen.','Alle müssen vorne stehen. Sie können nebeneinander, hintereinander oder schräg verbunden sein.','Verbundene Bienen behalten ihre Plätze, bis alle in der Gruppe fertig sind.'],
 tutCoreT:'Falle in der Mitte',tutCore:['Genau in der Mitte des Bildes liegt ein Feld in einer anderen Farbe.','Seine Biene ist mit einer äußeren Biene verbunden. Beide belegen einen Platz, bis die Mitte frei ist.','Mach den Weg zur Mitte frei, bevor du dieses Paar schickst.'],
 tutKeyT:'Schlüssel und Schloss',tutKey:['Bienen in einer gesperrten Reihe können nicht los.','Auf dem Feld liegt ein Schlüssel. Erreicht das Schlüsselfeld den Rand, öffnet sich das Schloss.','Mach zuerst den Weg zum Schlüssel frei.'],
 tutShadeT:'Ähnliche Farben',tutShade:['Manche Farben sehen sich sehr ähnlich, wie Rot und Bordeaux.','Es sind verschiedene Farben und sie brauchen verschiedene Bienen.','Schau dir Karten und Feld genau an.'],
 tutHardT:'Schweres Level',tutHard:['Schwere Levels haben 4 statt 5 Plätze.','Jeder Zug zählt. Plane die Reihenfolge.','Die Belohnung ist größer: 50 Honig.'],
 tutVhardT:'Sehr schweres Level',tutVhard:['Die härtesten Levels: 4 Plätze und ein enges Layout.','Nutze bei Bedarf einen Boost: +1 Platz, Farbe weg, Biene wählen.','Belohnung: 120 Honig.'],
 tutGateT:'Rollladen',tutGate:['Ein Teil des Bretts liegt hinter einem Rollladen. Bienen kommen nicht hindurch, und die Waben darunter können nicht gesammelt werden.','Der Rollladen geht auf, sobald so viele Waben gesammelt sind wie angezeigt. Steht eine Farbe neben der Zahl, zählen nur Waben dieser Farbe.'],
 tutTubeT:'Überraschungsröhre',tutTube:['Manche Reihen enden in einer Röhre. Sie zeigt, wie viele Schwärme darin sind, aber nicht ihre Farben.','Erreicht die Röhre die erste Reihe, kommen die Schwärme einzeln heraus und zeigen erst dann ihre Farbe. Ein bisschen Glück, ein bisschen Planung!'],gateOpen:'Tor offen!',tubePick:'Schwärme in der Röhre können nicht gewählt werden',
 tutBoxT:'Farbkiste',tutBox:['Wird eine Wabe in der Farbe der Kiste gesammelt, wirft die Kiste ihre nächste Farbe genau in diese Lücke zurück: Die Biene nimmt eine, die Kiste legt eine nach.','Gibt es die Farbe der Kiste nicht mehr auf dem Brett, wirft sie alle übrigen Farben auf einmal auf die zuletzt gesammelten Stellen.','Auf der Kiste stehen die übrigen Farben und die aktuelle Farbe. Die kleine Wabe in der Ecke zeigt die nächste Farbe.','Ist die Kiste leer, öffnet sie sich und der Weg ist frei.'],

/* ================= swarms =================
   A tile in the rows is a swarm: its number is how many bees it holds. In a slot its bees leave one after another.
   Each bee flies around the board to the point nearest its hexagon, picks that one up and carries it to the hive.
   Each bee flies round the board, enters at the first opening and follows the empty corridors to the nearest
   free hexagon of its colour (see routeSearch). With a joker target it heads for the reachable one closest to that point. */
function freeSlots(){return G.slots.reduce((a,s)=>a+(s===null?1:0),0)}

    if(!m){G.shake=1;toast(t('linkBlocked'));return}

}
function noRoom(){sfx('buzz');G.shake=1;G.flash=1;try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}

/* ================= update ================= */
function update(dt){

    else{save.speed2=false;persist();toast(t('x2over'));hud();sfx('speedOff')}}
  // speed: 1x normal, 2x with the speed boost, 3x automatically once every row is empty
  const spd=G.auto2?3:save.speed2?2:1;
  if(!G.auto2&&G.state==='play'&&G.columns.every(c=>!c.length)){G.auto2=true;if(!save.seenAuto2){save.seenAuto2=true;persist();toast(t('auto2'))}}
  // swarms send their bees
  for(const sw of G.swarms.slice()){
    if(sw.done||sw.n<=0)continue;sw.next-=dt;if(sw.next>0)continue;
    const rt=pickCell(sw);if(!rt){sw.waiting=true;continue}
    sw.waiting=false;sendUnit(sw,rt);sw.next=UNIT_GAP/spd;if(sw.n<=0)finishSwarm(sw);
  }
  // bees in flight
  const st=spd*UNIT_SPEED*dt;
  for(let q=G.units.length-1;q>=0;q--){const u=G.units[q];let move=st;
    while(move>0&&u.pi<u.pts.length){const t=u.pts[u.pi],dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);if(Math.abs(dx)>0.5)u.dir=dx<0?-1:1;
      if(d<=move){u.x=t.x;u.y=t.y;u.pi++;move-=d}else{u.x+=dx/d*move;u.y+=dy/d*move;move=0}}
    if(u.pi>=u.pts.length){
      if(u.phase==='out'){if(!G.cells[u.cell].cleared)clearCell(u.cell);goBack(u)}
      else{G.units.splice(q,1);G.hivePulse=1;sfx('deliver')}
    }
  }
  G.cells.forEach(c=>{if(c.pop>0){c.pop=Math.max(0,c.pop-dt*3);if(c.pop===0)markBoard()}});
  if(G.intro<1){G.intro=Math.min(1,G.intro+dt/1.1);if(G.intro>=1)markBoard()}
  if(G.reveal!=null)G.reveal=Math.min(1.6,G.reveal+dt/1.1);
  for(let q=G.throws.length-1;q>=0;q--){const th=G.throws[q];th.t+=dt/0.3;if(th.t>=1){const c=G.cells[th.i];c.fly=0;if(!c.cleared)c.pop=1;markBoard();G.throws.splice(q,1)}}
  if(G.box)G.box.pulse=Math.max(0,(G.box.pulse||0)-dt*4);
  // the box colour is gone from the board: all remaining colours fly at once onto the most recently collected spots
  if(G.box&&G.box.q.length&&G.state==='play'){const B=G.box,k=B.q[0];B.idle=(B.idle||0)+dt;
    if(B.idle>0.45&&!G.cells.some(c=>!c.cleared&&!c.box&&c.k===k)){B.idle=0;let n=0;
      for(let h=G.hist.length-1;h>=0&&B.q.length;h--){const i=G.hist[h],c=G.cells[i];if(c.cleared&&!c.box&&!(gateShut()&&c.gt)){boxThrow(i,-0.12*n);n++}}

  if(G.gate){const Q=G.gate;Q.pulse=Math.max(0,(Q.pulse||0)-dt*4);if(Q.open&&Q.t<1)Q.t=Math.min(1,Q.t+dt/0.8)}

  for(let i=G.flyers.length-1;i>=0;i--){G.flyers[i].t+=dt/0.24;if(G.flyers[i].t>=1)G.flyers.splice(i,1)}
  for(let i=G.sparks.length-1;i>=0;i--){const q=G.sparks[i];q.t+=dt/0.55;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=60*dt;if(q.t>=1)G.sparks.splice(i,1)}

  for(let i=G.bursts.length-1;i>=0;i--){G.bursts[i].t+=dt/0.6;if(G.bursts[i].t>=1)G.bursts.splice(i,1)}
  for(let i=G.confetti.length-1;i>=0;i--){const c=G.confetti[i];c.vy+=500*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;c.life-=dt;if(c.life<=0)G.confetti.splice(i,1)}

/* Everything is synthesized with Web Audio: no sound files. Effects and music have separate switches. */
let actx=null,sfxBus=null,musBus=null,noiseBuf=null;const lastT={};
function ac(){try{if(!actx){actx=new(window.AudioContext||window.webkitAudioContext)();sfxBus=actx.createGain();sfxBus.gain.value=0.9;sfxBus.connect(actx.destination);
  musBus=actx.createGain();musBus.gain.value=0.5;musBus.connect(actx.destination);
  noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1}
  if(actx.state==='suspended'&&!document.hidden)actx.resume()}catch(e){actx=null}return actx}
function audioOn(){return ac()}
function tone(f,d,type='sine',v=.12,delay=0,slide=0,bus){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(bus||sfxBus);o.start(t);o.stop(t+d+.03)}
function noise(d,f0,f1,v=.1,delay=0,q=1.2,bus){const a=ac();if(!a)return;const t=a.currentTime+delay,src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();src.buffer=noiseBuf;bp.type='bandpass';bp.Q.value=q;
  bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  src.connect(bp).connect(g).connect(bus||sfxBus);src.start(t,Math.random()*.5);src.stop(t+d+.05)}
const thr=(n,ms)=>{const now=performance.now();if(now-(lastT[n]||0)<ms)return true;lastT[n]=now;return false};
function sfx(n){if(save.muted)return;try{
  if(n==='tap'){tone(520,.09,'triangle',.13,0,1.5);noise(.06,2500,1200,.03)}
  else if(n==='click'){if(thr(n,60))return;tone(1400,.03,'square',.025)}
  else if(n==='pick'){if(thr(n,45))return;tone(880+Math.random()*600,.06,'sine',.04,0,1.3)}
  else if(n==='launch'){if(thr(n,90))return;tone(210+Math.random()*40,.09,'sawtooth',.018,0,1.15)}
  else if(n==='deliver'){if(thr(n,110))return;tone(620+Math.random()*120,.07,'triangle',.035,0,.7)}
  else if(n==='pop'){tone(320,.16,'triangle',.15,0,2.6);tone(1200,.08,'sine',.06,.03);noise(.12,3000,800,.05)}
  else if(n==='buzz'){tone(130,.22,'sawtooth',.08,0,.8);tone(98,.22,'square',.03)}
  else if(n==='coin'){tone(988,.08,'square',.045);tone(1319,.14,'square',.045,.07)}
  else if(n==='unlock'){tone(660,.1,'triangle',.12);tone(990,.12,'triangle',.12,.09);tone(1320,.2,'sine',.08,.18);noise(.1,5000,3000,.03,.05)}
  else if(n==='key'){[1568,1976,2349].forEach((f,i)=>tone(f,.12,'sine',.05,i*.05));noise(.4,1200,4000,.035,.05,2)}
  else if(n==='throw'){if(thr(n,70))return;noise(.18,600,2400,.06,0,3);tone(300,.14,'sine',.04,0,2)}
  else if(n==='boxColor'){tone(784,.12,'triangle',.08);tone(1046,.16,'triangle',.07,.08)}
  else if(n==='boxOpen'){noise(.35,1800,300,.16,0,.8);tone(180,.25,'square',.06,0,.5);[523,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.08,.12+i*.07))}
  else if(n==='reveal'){if(thr(n,120))return;tone(1046+Math.random()*300,.1,'sine',.04,0,1.2)}
  else if(n==='slotAdd'){tone(440,.1,'triangle',.1,0,1.6);tone(880,.16,'sine',.07,.08);noise(.1,4000,6000,.03)}
  else if(n==='clear'){noise(.6,400,3000,.12,0,1.5);[1046,880,740,622,523].forEach((f,i)=>tone(f,.12,'sine',.05,.08+i*.06))}
  else if(n==='aim'){tone(1318,.08,'sine',.08);tone(1760,.22,'sine',.06,.07)}
  else if(n==='shuffle'){for(let i=0;i<5;i++)noise(.07,1500+i*400,900,.05,i*.06,4);tone(600,.25,'triangle',.05,0,1.8)}
  else if(n==='speedOn')tone(220,.3,'sawtooth',.05,0,3);
  else if(n==='speedOff')tone(660,.3,'sawtooth',.05,0,.33);
  else if(n==='chain'){tone(2000,.05,'square',.03);tone(2400,.06,'square',.03,.05)}
  else if(n==='start')[392,523,659,784].forEach((f,i)=>tone(f,.14,'triangle',.07,i*.07));
  else if(n==='ding'){tone(1046,.25,'sine',.08);tone(1568,.3,'sine',.05,.04)}
  else if(n==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.1));noise(.6,3000,8000,.04,.4,.6)}
  else if(n==='lose')[392,330,262,196].forEach((f,i)=>tone(f,.32,'sine',.11,i*.17));
}catch(e){}}
/* two original loops: a calm one for the home screen and a bouncy one for play */
const mf=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
 home:{bpm:84,chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],
   mel:[[0,76,4],[4,79,4],[8,81,6],[14,79,2],[16,76,6],[22,74,2],[24,72,8],[32,69,4],[36,72,4],[40,74,4],[44,76,4],[48,74,8],[56,67,8]]},

let music={want:null,cur:null,step:0,next:0,cycle:0,timer:0};
function musicNote(f,t,d,type,v){const a=actx,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(musBus);o.start(t);o.stop(t+d+.05)}
function musicDrum(t,kind){const a=actx;if(kind==='k'){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.15);o.connect(g).connect(musBus);o.start(t);o.stop(t+.17)}
  else{const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=noiseBuf;f.type=kind==='h'?'highpass':'bandpass';f.frequency.value=kind==='h'?7000:1800;g.gain.setValueAtTime(kind==='h'?.035:.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==='h'?.04:.1));src.connect(f).connect(g).connect(musBus);src.start(t,Math.random()*.5);src.stop(t+.12)}}
function musicTick(){if(!actx||!music.cur||actx.state!=='running')return;const S=SONGS[music.cur],sp=60/S.bpm/4;
  while(music.next<actx.currentTime+0.15){const st=music.step%64,bar=Math.floor(st/16),t=music.next,ch=S.chords[bar];
    if(music.cur==='home'){if(st%2===0)musicNote(mf(ch[(st/2)%3]),t,sp*3,'sine',.05);if(st%8===0)musicNote(mf(ch[0]-24),t,sp*7,'triangle',.07)}
    else{if(st%2===0)musicNote(mf(ch[0]-12+(st%4===2?12:0)),t,sp*1.6,'triangle',.07);if(st%8===0)musicDrum(t,'k');if(st%8===4)musicDrum(t,'s');if(st%4===2)musicDrum(t,'h');if(st%16===0)ch.forEach(m=>musicNote(mf(m),t,sp*14,'sine',.018))}
    const odd=music.cycle%2===1;S.mel.forEach(([s0,m,len])=>{if(s0===st)musicNote(mf(m-(odd&&music.cur==='game'?12:0)),t,sp*len*(music.cur==='home'?1.1:.85),music.cur==='home'?'triangle':'square',music.cur==='home'?.055:(odd?.025:.03))});
    music.next+=sp;music.step++;if(music.step%64===0)music.cycle++}}
function playMusic(name){music.want=name;if(save.musicOff||!name){music.cur=null;return}const a=ac();if(!a)return;
  if(music.cur!==name){music.cur=name;music.step=0;music.cycle=0;music.next=a.currentTime+0.1}
  if(!music.timer)music.timer=setInterval(musicTick,40)}

    else if(id==='x2_30')save.bank2x+=1800;
    else if(id==='x2_h'){if(save.honey<250){toast(t('needHoney',fmt(250),fmt(save.honey)));return}save.honey-=250;save.bank2x+=600}
    else if(id==='noads')save.noAds=true;else if(id==='ad')save.honey+=60;
    persist();hud();homeHud();sfx('coin');b.disabled=true;b.textContent=t('bought');
    if(id==='starter'||id==='noads')b.closest('.pack').style.opacity='.6'});
  document.getElementById('shopClose').onclick=()=>{closeModal();if(G&&G.mode==='shop')setMode(null);if(G&&G.state==='lost')lose()};
}
document.getElementById('hShop').onclick=()=>openShop();
document.getElementById('hDaily').onclick=showDaily;
document.getElementById('hInf').onclick=()=>openShop();
document.getElementById('hHow').onclick=()=>showTuts(Object.keys(TUT_KEYS),closeModal,false);
document.getElementById('hLang').onclick=()=>{save.lang=LANGS[(LANGS.indexOf(lang())+1)%3];persist();applyLang();showHome()};
document.getElementById('hOffer').onclick=()=>openShop();
document.getElementById('hSound').onclick=()=>{save.muted=!save.muted;persist();homeHud();if(!save.muted)sfx('ding')};
document.getElementById('hMusic').onclick=()=>{save.musicOff=!save.musicOff;persist();homeHud();playMusic(save.musicOff?null:'home');if(save.musicOff)music.want='home'};
document.querySelector('.top .pill:last-child').style.cursor='pointer';
document.querySelector('.top .pill:last-child').onclick=()=>{if(G&&G.state==='play'&&!G.mode){setMode('shop');openShop()}};

/* ================= modal & loop ================= */
const modal=document.getElementById('modal'),card=document.getElementById('card');
let modalTick=0;
function openModal(html){clearInterval(modalTick);card.innerHTML=html;modal.hidden=false;card.scrollTop=0}
function closeModal(){clearInterval(modalTick);modal.hidden=true}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(G&&home.hidden){update(dt);draw()}requestAnimationFrame(frame)}
resize();
const _d=new Date(),today=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
syncLives();
// one-time cap for players who built up a large 2x bank under the old rules
if(!save.v2x){save.bank2x=Math.min(save.bank2x,NEW_PLAYER_2X);save.v2x=1}
if(!save.album){save.album={};for(let L=0;L<save.level;L++){const n=designFor(L);save.album[n]=(save.album[n]||0)+1}}
let bootMsg='';
if(save.inLevel!=null){loseLife();save.streak=0;save.inLevel=null;bootMsg=t('lifeTaken')}
if(save.lastDay!==today){const first=!save.lastDay;save.lastDay=today;if(first)bootMsg=t('welcome')}
{const y=new Date(Date.now()-864e5),yest=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(save.dailyClaim!==today){if(save.dailyClaim!==yest)save.dailyIdx=0;save.dailyReady=true}}
persist();if(bootMsg)setTimeout(()=>toast(bootMsg),600);
// retention: one event per day the game is opened, bucketed by days since the first visit
{const dnow=new Date(),tday=dnow.getFullYear()+'-'+(dnow.getMonth()+1)+'-'+dnow.getDate();if(!save.first)save.first=Date.now();
  if(save.seenDay!==tday){save.seenDay=tday;const d=Math.floor((Date.now()-save.first)/864e5);track('open/day-'+(d<=3?d:d<=7?'4-7':d<=14?'8-14':d<=30?'15-30':'30+'));persist()}}
if('serviceWorker' in navigator&&PLATFORM==='web')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyLang();showHome();requestAnimationFrame(frame);{const bd=document.getElementById('albumBadge');if(bd)bd.hidden=!ALBUMS.some(albClaimable)}
if(save.dailyReady)setTimeout(()=>{if(!home.hidden&&modal.hidden)showDaily()},bootMsg?1900:700);
</script>
